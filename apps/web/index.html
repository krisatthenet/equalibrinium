<!doctype html>
<html lang="lt">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/logo.svg" />
		<link rel="icon" type="image/png" href="/logo-192.png" sizes="192x192" />
		<link rel="apple-touch-icon" href="/logo-192.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Connect with qualified specialists for all your home improvement needs." />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://workbee.space/" />
		<meta property="og:title" content="WorkBee" />
		<meta property="og:description" content="Connect with qualified specialists for all your home improvement needs." />
		<meta property="og:image" content="https://workbee.space/logo-192.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="WorkBee" />
		<meta name="twitter:description" content="Connect with qualified specialists for all your home improvement needs." />
		<meta name="twitter:image" content="https://workbee.space/logo-192.png" />
		<meta name="theme-color" content="#0a0a0a" />
	<meta name="color-scheme" content="dark" />
		<link rel="manifest" href="/manifest.json" />
		<title>WorkBee - Susisiekite su kvalifikuotais specialistais visiems jūsų namų tobulinimo poreikiams</title>
		<style>
			#splash{position:fixed;inset:0;background:#0a0a0a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:24px}
			#splash-logo{width:72px;height:72px;animation:sp-pulse 1.8s ease-in-out infinite}
			#splash-bar-wrap{width:160px;height:3px;background:#1f1f1f;border-radius:9999px;overflow:hidden;position:relative}
			#splash-bar{position:absolute;top:0;height:100%;background:#facc15;border-radius:9999px;animation:sp-slide 1.5s ease-in-out infinite}
			@keyframes sp-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.95)}}
			@keyframes sp-slide{0%{left:-60%;width:60%}50%{left:30%;width:40%}100%{left:100%;width:60%}}
		</style>
	</head>
	<body>
		<div id="root">
			<div id="splash">
				<img id="splash-logo" src="/logo-192.png" alt="WorkBee" />
				<div id="splash-bar-wrap"><div id="splash-bar"></div></div>
			</div>
		</div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
