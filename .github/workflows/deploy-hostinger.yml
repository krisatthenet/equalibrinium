name: Deploy Frontend to Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - '.github/workflows/deploy-hostinger.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --prefix apps/web

      - name: Build
        run: npm run build --prefix apps/web
        env:
          VITE_POCKETBASE_URL: ${{ secrets.VITE_POCKETBASE_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_MIXPANEL_TOKEN: ${{ secrets.VITE_MIXPANEL_TOKEN }}

      - name: Deploy via rsync over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "[lt-bnk-web508.main-hosting.eu]:65002 ssh-rsa " >> ~/.ssh/known_hosts
          echo "[lt-bnk-web508.main-hosting.eu]:65002 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBC5Y9tMvRzz6O1o9bNtt9N1lDYb6+Ot3EMwpgrURnkBjG+NiFsHgXHuw7Dn2GmuQpI2r+Hk6pnabsaijF8qpWto=" >> ~/.ssh/known_hosts
          echo "[lt-bnk-web508.main-hosting.eu]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIONYfb7JPK4L4YyL8t8QSQb72Tfs+bj4KkUpc3CB4goX" >> ~/.ssh/known_hosts
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes -p 65002" \
            dist/apps/web/ \
            u168231407@lt-bnk-web508.main-hosting.eu:/home/u168231407/domains/workbee.space/public_html/
