name: Deploy Frontend to Hostinger (Production)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --prefix apps/web

      - name: Build
        run: npm run build --prefix apps/web
        env:
          VITE_POCKETBASE_URL: ${{ secrets.VITE_POCKETBASE_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Deploy via rsync over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Best-effort host-key prefetch — never abort the step on keyscan
          # failure/timeout (default 5s) under `bash -e`. Force IPv4 (-4):
          # the host has an AAAA record but GitHub runners often lack IPv6
          # egress, so IPv6 attempts fail with "Network is unreachable".
          ssh-keyscan -4 -p 65002 lt-bnk-web508.main-hosting.eu >> ~/.ssh/known_hosts 2>/dev/null || true
          # accept-new lets rsync trust the host on first connect even if the
          # keyscan above produced nothing, instead of failing host verification.
          # Retry a few times to ride out transient runner/network blips.
          ok=0
          for attempt in 1 2 3; do
            if rsync -avz --delete \
              -e "ssh -4 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -p 65002" \
              dist/apps/web/ \
              u168231407@lt-bnk-web508.main-hosting.eu:/home/u168231407/domains/workbee.space/public_html/; then
              ok=1; break
            fi
            echo "rsync attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          [ "$ok" = "1" ] || { echo "All rsync attempts failed"; exit 1; }
