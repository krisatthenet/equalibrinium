name: Deploy Backend to Railway (Production)

# Railway deploys API and PocketBase automatically via its native GitHub
# integration whenever main is pushed — no CLI upload needed.
# This workflow exists to surface those deployments in the GitHub
# Environments tab under "Production".

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/pocketbase/**'
      - '.github/workflows/deploy-staging.yml'

jobs:
  railway-deploy:
    name: Railway auto-deploy (API + PocketBase)
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Confirm Railway GitHub integration is active
        run: |
          echo "Railway deploys workbee-api and workbee-pocketbase"
          echo "automatically from the main branch via GitHub integration."
          echo "No CLI action required — Railway picked up this push."
