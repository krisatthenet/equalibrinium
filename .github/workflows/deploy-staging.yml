name: Deploy Backend to Railway (Production)

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/pocketbase/**'
      - '.github/workflows/deploy-staging.yml'

jobs:
  deploy-api:
    name: Deploy API → Railway Production
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API service
        working-directory: apps/api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --project fa829754-67fe-4917-a7e3-be7159a326e0 --service workbee-api --environment production --detach

  deploy-pocketbase:
    name: Deploy PocketBase → Railway Production
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy PocketBase service
        working-directory: apps/pocketbase
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --project fa829754-67fe-4917-a7e3-be7159a326e0 --service workbee-pocketbase --environment production --detach
