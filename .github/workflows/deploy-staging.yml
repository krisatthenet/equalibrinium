name: Deploy Staging

on:
  push:
    branches: [dev]

jobs:
  deploy-api:
    name: Deploy API → Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API service
        working-directory: apps/api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --project fa829754-67fe-4917-a7e3-be7159a326e0 --service workbee-api --environment staging --detach

  deploy-pocketbase:
    name: Deploy PocketBase → Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy PocketBase service
        working-directory: apps/pocketbase
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --project fa829754-67fe-4917-a7e3-be7159a326e0 --service workbee-pocketbase --environment staging --detach
